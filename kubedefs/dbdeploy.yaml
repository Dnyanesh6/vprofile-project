apiVersion: v1
kind: Deployment
metadata:
  name: myapp
spec:
  matchLabels:
      app: myapp
  template:
    metadata:
      labels:
      spec:
      containers:
      - name: myapp
        image: <Image>
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: <Port>
