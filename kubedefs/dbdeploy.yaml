
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb

spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprodb

  template:
    metadata:
      labels:
        app: vprodb

    spec:
      containers:
        - name: vprodb
          image: dnyaneshchaudhari/vprofiledb

          ports:
            - name: vprodb-port
              containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpro-secret
                  key: db-pass

          volumeMounts:
            - name: vprodb-db-data
              mountPath: /var/lib/mysql

      volumes:
        - name: vprodb-db-data
          persistentVolumeClaim:
            claimName: db-pv-claim

      initContainers:
        - name: busybox
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - rm -rf /var/lib/mysql/lost+found
          volumeMounts:
            - name: vprodb-db-data
              mountPath: /var/lib/mysql
